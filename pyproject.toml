[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esae"
version = "0.2.0"
description = "ESAE — Emergent-Stitching Architecture for Evolution"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []  # L3 core = stdlib only

[project.optional-dependencies]
tracing = []  # future: json (already stdlib)
test = ["pytest>=7.0"]

[project.scripts]
ease = "cli.__init__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "cli.commands*", "kernel*", "evolution*", "tracing*", "memory*"]
